name: secagent-devsecops-pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  prebuild-quality-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -e .[dev]

      - name: Unit and integration tests
        run: |
          . .venv/bin/activate
          pytest --cov=secagent --cov-report=term-missing

      - name: Validate secagent config
        run: |
          . .venv/bin/activate
          secagent validate-config --config secagent.yml.example

      - name: Pre-build security scan (using published secagent)
        run: |
          docker pull sikanderali/opencode-neon:latest
          docker run --rm -v "$PWD":/workspace -w /workspace \
            sikanderali/opencode-neon:latest \
            scan --target /workspace --config /workspace/secagent.yml.example

      - name: Upload pre-build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-secagent-reports
          path: reports/

  build-test-push-image:
    runs-on: ubuntu-latest
    needs: prebuild-quality-security
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t sikanderali/opencode-neon:latest .

      - name: Test built image basics
        run: |
          docker run --rm sikanderali/opencode-neon:latest version

      - name: Post-build security scan (using newly built image)
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace \
            sikanderali/opencode-neon:latest \
            scan --target /workspace --config /workspace/secagent.yml.example

      - name: Upload post-build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postbuild-secagent-reports
          path: reports/

      - name: Upload SARIF
        if: always() && hashFiles('reports/secagent-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/secagent-report.sarif

      - name: Docker Hub login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_LOGIN }}" --password-stdin

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push sikanderali/opencode-neon:latest
