[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secagent"
version = "0.1.0"
description = "Security orchestrator CLI for DevSecOps workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "SecAgent Maintainers" }
]
dependencies = [
  "typer>=0.12.0,<1.0.0",
  "pydantic>=2.7.0,<3.0.0",
  "PyYAML>=6.0.1,<7.0.0",
  "Jinja2>=3.1.4,<4.0.0",
  "rich>=13.7.1,<14.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0,<9.0.0",
  "pytest-cov>=5.0.0,<6.0.0"
]

[project.scripts]
secagent = "secagent.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"secagent.reports" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
